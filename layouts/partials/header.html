<!-- Search Engine Engine & Keyboard Event Handlers Script -->
<script>
  (function() {
    let searchIndex = null;
    const triggerBtn = document.getElementById('search-trigger-btn');
    const backdrop = document.getElementById('search-modal-backdrop');
    const panel = document.getElementById('search-modal-panel');
    const input = document.getElementById('search-input');
    const closeBtn = document.getElementById('search-close-btn');
    const initialPrompt = document.getElementById('search-initial-prompt');
    const resultsList = document.getElementById('search-results-list');
    const emptyPrompt = document.getElementById('search-empty-prompt');
    const tagPills = document.querySelectorAll('.search-tag-pill');

    if (!triggerBtn || !backdrop || !input) return;

    // Load search index JSON on demand
    async function loadSearchIndex() {
      if (searchIndex) return searchIndex;
      try {
        const res = await fetch('/index.json');
        searchIndex = await res.json();
        return searchIndex;
      } catch (err) {
        console.error('Failed to load search index:', err);
        return [];
      }
    }

    // Open Search Modal Window
    async function openModal() {
      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        backdrop.classList.remove('opacity-0');
        panel.classList.remove('scale-95');
        panel.classList.add('scale-100');
      });
      input.focus();
      await loadSearchIndex();
    }

    // Close Search Modal Window
    function closeModal() {
      backdrop.classList.add('opacity-0');
      panel.classList.remove('scale-100');
      panel.classList.add('scale-95');
      setTimeout(() => {
        backdrop.classList.add('hidden');
        input.value = '';
        renderResults('');
      }, 200);
    }

    triggerBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) closeModal();
    });

    // Keyboard Shortcuts (Ctrl+K / Cmd+K / Esc)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (backdrop.classList.contains('hidden')) {
          openModal();
        } else {
          closeModal();
        }
      } else if (e.key === 'Escape' && !backdrop.classList.contains('hidden')) {
        closeModal();
      }
    });

    // Tag pills quick search click
    tagPills.forEach(pill => {
      pill.addEventListener('click', () => {
        input.value = pill.textContent.trim();
        renderResults(input.value);
      });
    });

    // Perform Instant Real-Time Search Filtering
    async function renderResults(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        initialPrompt.classList.remove('hidden');
        resultsList.classList.add('hidden');
        emptyPrompt.classList.add('hidden');
        resultsList.innerHTML = '';
        return;
      }

      const data = await loadSearchIndex();
      const filtered = data.filter(item => {
        const title = (item.title || '').toLowerCase();
        const desc = (item.description || '').toLowerCase();
        const cat = (item.category || '').toLowerCase();
        const tags = (item.tags || '').toLowerCase();
        return title.includes(q) || desc.includes(q) || cat.includes(q) || tags.includes(q);
      });

      initialPrompt.classList.add('hidden');

      if (filtered.length === 0) {
        resultsList.classList.add('hidden');
        emptyPrompt.classList.remove('hidden');
        resultsList.innerHTML = '';
      } else {
        emptyPrompt.classList.add('hidden');
        resultsList.classList.remove('hidden');

        resultsList.innerHTML = filtered.map(item => {
          // Highlight matched query term
          const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
          const highlightedTitle = item.title.replace(regex, '<mark class="bg-fuchsia-500/40 text-white rounded px-1">$1</mark>');
          const highlightedDesc = item.description.replace(regex, '<mark class="bg-fuchsia-500/40 text-white rounded px-1">$1</mark>');

          return `
            <a href="${item.permalink}" class="block bg-purple-900/60 hover:bg-purple-800/80 border border-purple-700/60 hover:border-fuchsia-400/80 rounded-xl p-3.5 transition-all shadow-md group">
              <div class="flex items-center justify-between text-xs mb-1.5">
                <span class="font-bold text-fuchsia-300 bg-purple-950 px-2.5 py-0.5 rounded-full border border-purple-600/50">
                  ${item.category}
                </span>
                <span class="text-purple-300/80">${item.date}</span>
              </div>
              <h4 class="text-sm font-bold text-white group-hover:text-fuchsia-200 leading-snug mb-1">
                ${highlightedTitle}
              </h4>
              <p class="text-xs text-purple-200/80 line-clamp-2 leading-relaxed">
                ${highlightedDesc}
              </p>
            </a>
          `;
        }).join('');
      }
    }

    input.addEventListener('input', (e) => renderResults(e.target.value));
  })();
</script>
